<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNHS ICT/CSS Enrollment Management</title>
    <link rel="icon" href="images/logo_mnhs.png" type="image/x-icon">
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <header>
        <h1>MNHS ICT/CSS Enrollment Management System</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../pages/enroll.html">Enroll</a></li>
                <li><a href="../pages/about.html">About</a></li>
                <li><a href="../pages/contact.html">Contact</a></li>
            </ul>
        </nav>
        <span><a href="../pages/login.html">
                <button type="button">Login</button>
            </a></span>
    </header>
    <main>

        <div class="container">

        <!-- LEFT SIDE -->
        <div class="left-container">
            <h1>Welcome!</h1>
            <p>Welcome to our website.</p>
        </div>
           
        <div class="login-container" id="login-form">
            
            <h2>Login</h2>

            <input type="text" placeholder="Username">

            <input type="password" placeholder="Password">
            <a href="/pages/dashboard.html"><button  class="btn" id="login-button">
                Login
            </button></a>
            
            <button class="btn" id="register-button">
                Register
            </button>
            <button class="btn" id="forgot-password-button">
                Forgot Password
            </button>

        </div>
        </div>
        <div class="login-container" id="forgot-password-form" style="display: none;">
            <h2>Forgot Password</h2>
            <input type="email" placeholder="Email">
            <button class="btn">
                Reset Password
            </button>
        </div>
        <div class="login-container" id="register-form" style="display: none;">
            <h2>Register</h2>
            <form>
            <input type="file" accept="image/*" id="profile-picture" style="display: none;" onchange="previewProfilePicture(event)">
            <label for="profile-picture">
                <img src="../images/defaulf_Profile.png" alt="Profile Picture" id="profile-picture-preview" style="width: 100px; height: 100px;  cursor: pointer; justify-content: center; align-items: center; border-radius: 50%;">
            </label>
            <input type="text" placeholder="Employee ID Number">
            <input type="text" placeholder="First Name">
            <input type="text" placeholder="Middle Name">
            <input type="text" placeholder="Last Name">
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">
            <input type="password" placeholder="Confirm Password">
            <input type="email" placeholder="Email">
            <input type="text" placeholder="Contact Number">
            <button class="btn">
                Register
            </button>
                
            </form>
          
        </div>

    </main>
    <footer>
        <p>&copy; 2026 MNHS ICT/CSS Enrollment Management. All rights reserved.</p>
    </footer>
</body>
<script src="../Scripts/script.js"></script>

</html>
